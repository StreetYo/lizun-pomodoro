<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/__sdk/lizun.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="pomodoro" id="app" data-phase="focus" data-status="idle" hidden>
      <div class="dial">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="54" />
          <circle class="progress" id="progress" cx="60" cy="60" r="54" pathLength="100" />
        </svg>
        <div class="readout">
          <span class="time" id="time"></span>
          <span class="note" id="note"></span>
        </div>
      </div>

      <section class="side">
        <span class="phase" id="phase"></span>
        <div class="dots" id="dots"></div>

        <div class="today" id="today">
          <span class="caption" id="today-caption"></span>
          <span class="value" id="today-value"></span>
        </div>

        <div class="controls">
          <button class="primary" id="primary">
            <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
            </svg>
            <svg class="pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="5" width="4" height="14" rx="1.2" />
              <rect x="13.5" y="5" width="4" height="14" rx="1.2" />
            </svg>
          </button>
          <button class="secondary" id="skip">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 6.3v11.4a.8.8 0 0 0 1.24.66L14.5 12.7a.8.8 0 0 0 0-1.4L6.24 5.64A.8.8 0 0 0 5 6.3z" />
              <rect x="16.5" y="5.5" width="2.6" height="13" rx="1.1" />
            </svg>
          </button>
          <button class="secondary" id="reset">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12a8 8 0 1 0 8-8 8.7 8.7 0 0 0-6 2.4L4 8.5" />
              <path d="M4 4v4.5h4.5" />
            </svg>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
